<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0D0A06;
    --surface: #17120A;
    --surface2: #221A0E;
    --gold: #C9A227;
    --gold-light: #E2BC5A;
    --spice: #9B2D0E;
    --cream: #EDE0C4;
    --cream-muted: #A89070;
    --text: #EDE0C4;
    --text-muted: #8A7860;
    --border: rgba(201,162,39,0.18);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.35;
  }

  #root { position: relative; }

  /* TWEAKS PANEL */
  .tweaks-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 260px;
    background: #1C1508;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    z-index: 9999;
    display: none;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .tweaks-panel.open { display: block; }
  .tweaks-title {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .tweak-row { margin-bottom: 14px; }
  .tweak-label { font-size: 11px; color: var(--cream-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .tweak-select, .tweak-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 7px 10px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .tweak-toggle-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .toggle-switch {
    width: 36px; height: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-switch.on { background: var(--gold); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px;
    background: #fff; border-radius: 50%;
    transition: left 0.2s;
  }
  .toggle-switch.on .toggle-knob { left: 18px; }
</style>

      <div style={{ fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.08em', textAlign: 'center', lineHeight: 1.8 }}>
        FSSAI Reg No: 21325176000637<br />
        © 2025 Swadhu Nadan Acharukal
      </div>
      <div style={{ display: 'flex', gap: 20 }}>
        {[["YouTube", "https://www.youtube.com/@SwadhuNadanAcharukal"], ["Blog", "https://blog.swadhunadanacharukal.com/"]].map(([l, h]) => (
          <a key={l} href={h} target="_blank" style={{ fontSize: 12, color: 'var(--text-muted)', textDecoration: 'none', letterSpacing: '0.08em', textTransform: 'uppercase', transition: 'color 0.2s' }}
            onMouseEnter={e => e.target.style.color='var(--gold)'}
            onMouseLeave={e => e.target.style.color='var(--text-muted)'}
          >{l}</a>
        ))}
      </div>
    </footer>
  );
}

// ─── TWEAKS ────────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, open }) {
  const update = (k, v) => {
    const next = {...tweaks, [k]: v};
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };

  return (
    <div className={`tweaks-panel ${open ? 'open' : ''}`}>
      <div className="tweaks-title">Tweaks</div>

      <div className="tweak-row">
        <div className="tweak-label">Hero Layout</div>
        <select className="tweak-select" value={tweaks.heroLayout} onChange={e => update('heroLayout', e.target.value)}>
          <option value="centered">Centered</option>
          <option value="left">Left-aligned</option>
        </select>
      </div>

      <div className="tweak-row">
        <div className="tweak-label">Display Font</div>
        <select className="tweak-select" value={tweaks.font} onChange={e => update('font', e.target.value)}>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Georgia">Georgia</option>
          <option value="'Cormorant Garamond', serif">Cormorant Garamond</option>
        </select>
      </div>

      <div className="tweak-row">
        <div className="tweak-label tweak-toggle-row">
          Top Banner
          <div className={`toggle-switch ${tweaks.showBanner ? 'on' : ''}`} onClick={() => update('showBanner', !tweaks.showBanner)}>
            <div className="toggle-knob" />
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ───────────────────────────────────────────────────────────────────
function App() {
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  // Apply font tweak via CSS variable
  useEffect(() => {
    document.documentElement.style.setProperty('--display-font', tweaks.font);
  }, [tweaks.font]);

  return (
    <div>
      <Nav showBanner={tweaks.showBanner} />
      <Hero heroLayout={tweaks.heroLayout} />
      <Products />
      <Story />
      <GlobalReach />
      <Testimonials />
      <Contact />
      <Footer />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
